# .github/workflows/ci.yml

name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  ruby:
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake spec
      - run: bundle exec rake rubocop
      - if: matrix.ruby == '4.0'
        run: bundle exec rbs validate

  javascript:
    name: React ${{ matrix.react }}
    strategy:
      fail-fast: false
      matrix:
        react: ["18.3.1", "19.1.1"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - run: npm run test:js

  package:
    name: Package and clean install
    needs: [ruby, javascript]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.6
          bundler-cache: true
      - run: bin/package
